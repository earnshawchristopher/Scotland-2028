<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scotland 2028</title>
<meta name="description" content="Fife and Ayrshire, 9 to 15 September 2028.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root{
    --sea:#0e1e2b;      /* North Sea ink: dark panels */
    --sea2:#172c3c;
    --haar:#edf0ee;     /* sea mist: page */
    --paper:#fafbf9;
    --rule:#d5dbd7;
    --ink:#14212b;
    --muted:#5a6770;
    --gold:#9a7a35;     /* gold leaf on light */
    --leaf:#d6b877;     /* gold leaf on dark */
    --green:#2e5a47;
    --heather:#6b4a6e;
    --display:"Marcellus","Iowan Old Style",Georgia,serif;
    --body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--haar);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15}
  h2{font-size:30px;margin-bottom:6px}
  h3{font-size:21px}
  p{margin:0}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}
  .num{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .small{font-size:14px}

  /* masthead + tabs */
  .mast{background:var(--sea);color:#eef2f0}
  .mast .wrap{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px;padding-bottom:12px}
  .mast .name{font-family:var(--display);font-size:22px;letter-spacing:.02em;color:var(--leaf)}
  .mast .who{font-size:14px;color:#b9c5cc;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .tabs{position:sticky;top:0;z-index:10;background:var(--sea);border-top:1px solid #24394a}
  .tabs .wrap{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding-top:0;padding-bottom:0}
  .tabs .wrap::-webkit-scrollbar{display:none}
  .tab{background:none;border:0;padding:13px 0 11px;color:#a9b7c0;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;font-weight:500;font-size:15px}
  .tab[aria-selected=true]{color:#fff;border-bottom-color:var(--leaf)}

  main{padding:30px 0 70px}
  .panel{display:none}.panel.on{display:block}
  .lede{color:var(--muted);margin-bottom:22px;max-width:56ch}
  .block{margin-top:34px}
  .block>h3{margin-bottom:10px}

  /* the honours board: the one loud thing */
  .board{background:var(--sea);color:var(--leaf);padding:8px;margin-bottom:28px}
  .board .inner{border:1px solid var(--leaf);outline:1px solid var(--leaf);outline-offset:-5px;padding:30px 24px 26px}
  .board h1{font-size:clamp(36px,10.5vw,58px);letter-spacing:.03em;text-align:center}
  .board .dates{text-align:center;color:#c8d0d4;margin:8px 0 22px;font-size:15px}
  .board ol{list-style:none;margin:0;padding:0;font-family:var(--display);font-size:17px}
  .board li{display:flex;align-items:baseline;gap:8px;padding:5px 0}
  .board li .d{flex:none;width:74px}
  .board li .dots{flex:1;border-bottom:1px dotted #8a7a52;transform:translateY(-4px);min-width:14px}
  .board li .c{text-align:right}
  .board li.tbd .c{font-style:italic;color:#c8d0d4}
  .board .foot{text-align:center;margin-top:20px;font-size:14px;color:#c8d0d4}

  /* quiet surfaces */
  .sheet{background:var(--paper);border:1px solid var(--rule);border-radius:3px}
  .row{display:flex;justify-content:space-between;gap:16px;padding:13px 16px;border-top:1px solid var(--rule);align-items:baseline}
  .row:first-child{border-top:0}
  .row .l{min-width:0}
  .row .l b{font-weight:600}
  .row .l span{display:block;color:var(--muted);font-size:14px}
  .row .r{text-align:right;flex:none;font-weight:600}
  .row .r small{display:block;font-weight:400;color:var(--muted);font-size:13px}
  .row.total{background:var(--sea);color:#fff;border-radius:0 0 2px 2px}
  .row.total .r{font-family:var(--display);font-size:26px;color:var(--leaf);font-weight:400}
  .pad{padding:16px}

  .tag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
  .tag.ok{color:var(--green)} .tag.wait{color:var(--gold)} .tag.vote{color:var(--heather)}

  /* who are you */
  .pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media(min-width:520px){.pick{grid-template-columns:repeat(4,1fr)}}
  .pick button{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:14px 12px;text-align:left;cursor:pointer}
  .pick button b{display:block;font-family:var(--display);font-weight:400;font-size:20px}
  .pick button span{font-size:13px;color:var(--muted)}
  .pick button:hover{border-color:var(--gold)}

  /* itinerary */
  .day{display:grid;grid-template-columns:58px 1fr;gap:16px;padding:18px 16px;border-top:1px solid var(--rule)}
  .day:first-child{border-top:0}
  .day .dt{font-family:var(--display);text-align:center;line-height:1.1}
  .day .dt b{display:block;font-size:30px;font-weight:400}
  .day .dt span{font-size:14px;color:var(--muted)}
  .day h3{font-size:20px}
  .day .base{font-size:14px;color:var(--green);font-weight:600;margin-bottom:2px}
  .day ul{margin:8px 0 0;padding:0;list-style:none;font-size:14.5px;color:var(--muted)}
  .day li{padding:2px 0 2px 14px;position:relative}
  .day li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:1px;background:var(--gold)}
  .tee{display:inline-block;margin-top:6px;font-size:14px;font-weight:600}

  /* courses */
  .course{padding:18px 16px;border-top:1px solid var(--rule)}
  .course:first-child{border-top:0}
  .course .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .course .price{font-family:var(--display);font-size:22px;white-space:nowrap}
  .course .when{font-size:14px;color:var(--green);font-weight:600}
  .course p{font-size:14.5px;color:var(--muted);margin-top:6px}
  .fees{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:12px;font-size:14px}
  .fees div{background:var(--paper);padding:8px 10px}
  .fees b{display:block;font-weight:600}
  .fees span{color:var(--muted);font-size:13px}

  .opt{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--paper);border:0;border-top:1px solid var(--rule);padding:14px 16px;cursor:pointer;align-items:center}
  .opt:first-child{border-top:0}
  .opt b{font-weight:600}
  .opt small{display:block;color:var(--muted);font-size:13.5px;line-height:1.4;margin-top:2px}
  .opt .p{font-family:var(--display);font-size:19px;white-space:nowrap}
  .opt[aria-pressed=true]{box-shadow:inset 3px 0 0 var(--heather);background:#f4eff5}
  .votebox{border-color:var(--heather)}
  .votebox .head{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:10px}

  .check{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--rule);align-items:flex-start}
  .check:first-child{border-top:0}
  .check i{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--gold);margin-top:2px;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
  .check.done i{background:var(--green);border-color:var(--green)}
  .check b{font-weight:600;display:block}
  .check span{font-size:14px;color:var(--muted)}

  .field{display:block;margin-bottom:12px}
  .field>span{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
  input,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink)}
  .btn{background:var(--sea);color:#fff;border:0;border-radius:3px;padding:11px 18px;font-weight:600;cursor:pointer}
  .btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
  .btn[disabled]{opacity:.5;cursor:default}
  .chips{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .chips label{display:flex;gap:8px;align-items:center;border:1px solid var(--rule);border-radius:3px;padding:8px 10px;background:#fff}
  .chips input{width:auto}
  .msg{font-size:14px;margin-top:10px;color:var(--heather)}
  .pos{color:var(--green)}.neg{color:var(--heather)}
  .guide h3{margin:26px 0 8px}
  .guide ul{margin:0;padding-left:18px}
  .guide li{margin:5px 0}
  .two{display:grid;gap:14px}
  @media(min-width:600px){.two{grid-template-columns:1fr 1fr}}
  .note{font-size:14px;color:var(--muted);margin-top:10px}
  footer{font-size:13px;color:var(--muted);text-align:center;padding-bottom:40px}
</style>
</head>
<body>

const TABS = [["home","My trip"],["itinerary","Itinerary"],["golf","Golf"],["travel","Travel and houses"],["costs","Costs"],["expenses","Expenses"],["decisions","Decisions"],["guide","Field guide"]];
const S = {tab:"home", who:null, wed:SLOTS.wed.pick, thu:SLOTS.thu.pick,
  x:{rows:[], loaded:false, error:"", code:"", role:"", form:false, edit:null, msg:"", busy:false}};

const usd = gbp => gbp * TRIP.rate;
const $u = n => "$" + Math.round(n).toLocaleString("en-US");
const $g = n => "£" + Math.round(n).toLocaleString("en-US");
const allIn = (c, cad) => c.green + (cad ? c.caddie + (c.caddie ? c.tip : 0) : c.trolley);
const active = () => ["balgove","jubilee","old","balcomie",S.wed,S.thu];
const roundOf = day => day.slot ? S[day.slot] : day.round;
const me = () => GOLFERS.find(g => g.id === S.who) || null;
const wantsCaddie = (g, id) => (g && id in g.caddie) ? g.caddie[id] : COURSES[id].budgetCaddie;
const golfGBP = g => active().reduce((s,id) => s + allIn(COURSES[id], wantsCaddie(g,id)), 0);
const sharedUSD = () => usd((HOUSES[0].total + HOUSES[1].total + TRIP.vanHire + TRIP.vanFuel) / TRIP.size);
const tag = (cls, t) => `<span class="tag ${cls}">${t}</span>`;
const slotOpen = id => Object.values(SLOTS).some(s => !s.decided && s.options.includes(id));

function board(){
  return `<div class="board"><div class="inner">
    <h1>Scotland 2028</h1>
    <p class="dates">Fife and Ayrshire, 9 to 15 September</p>
    <ol>${DAYS.filter(d => roundOf(d)).map(d => { const id = roundOf(d);
      return `<li class="${slotOpen(id) ? "tbd" : ""}"><span class="d">${d.dow} ${d.d}</span><span class="dots"></span><span class="c">${COURSES[id].name}</span></li>`; }).join("")}</ol>
    <p class="foot">${daysToGo()} days to the first tee. Italic rounds are still to be voted on.</p>
  </div></div>`;
}
function daysToGo(){ return Math.max(0, Math.ceil((new Date(2028,8,9) - new Date()) / 864e5)).toLocaleString("en-US"); }

function home(){
  const g = me();
  if(!g) return board() + `<h2>Who's reading?</h2>
    <p class="lede">Pick your name to see your own flights, rounds, costs and what's still needed from you. Your phone will remember.</p>
    <div class="pick">${GOLFERS.map(x => `<button data-who="${x.id}"><b>${x.name}</b><span>${x.home}</span></button>`).join("")}</div>`;

  const todo = [
    [g.budgetGiven, "Tell "+TRIP.organiser+" your budget ceiling", "A comfortable all-in number, excluding food."],
    [g.handicap !== null && g.certificate, "Send your handicap index and certificate", g.handicap !== null ? "Index on file: "+g.handicap+"." : "The Old Course needs 36 or better; Royal Troon caps men at 20."],
    [!!g.clubs, "Clubs: bring, ship or rent", g.clubs ? "You said: "+g.clubs+"." : "This decides how big a vehicle we need."],
    [g.driver !== null, "Say whether you'll drive", g.driver === null ? "We need at least two volunteers for a large van on the left." : (g.driver ? "You're a named driver." : "You're not driving.")],
    [active().every(id => !COURSES[id].caddie || id in g.caddie), "Choose caddie or no caddie for each round", "So they can be pre-booked. Fees and tips are paid in cash."],
    [g.passportOK, "Confirm your passport runs past March 2029", "Six months beyond the trip is the safe margin."],
    [!!g.flightOut && !!g.flightBack, "Book your flights", TRIP.arrivalWindow ? TRIP.arrivalWindow+"." : "Not yet. Wait for the arrival window; fares open around autumn 2027."]
  ];
  const open = todo.filter(t => !t[0]).length;
  const golf = usd(golfGBP(g)), total = TRIP.flightUSD + sharedUSD() + golf;
  const warn = (g.handicap !== null && g.handicap > 20 && S.thu === "troon")
    ? `<p class="note" style="color:var(--heather)">Your index is above Royal Troon's limit of 20. Tell ${TRIP.organiser} before the Ayrshire vote.</p>` : "";

  return board() + `<h2>${g.name}'s trip</h2>
    <p class="lede">${open ? open+" thing"+(open>1?"s":"")+" still needed from you." : "Nothing needed from you right now."}</p>

    <div class="block" style="margin-top:0"><h3>Needed from you</h3><div class="sheet">
      ${todo.map(t => `<div class="check ${t[0]?"done":""}"><i>${t[0]?"✓":""}</i><div><b>${t[1]}</b><span>${t[2]}</span></div></div>`).join("")}
    </div></div>

    <div class="block"><h3>Your travel</h3><div class="sheet">
      <div class="row"><div class="l"><b>Outbound</b><span>From ${g.airport}, ${g.home}</span></div><div class="r">${g.flightOut || "Not booked"}</div></div>
      <div class="row"><div class="l"><b>Return</b><span>Friday, Sep 15</span></div><div class="r">${g.flightBack || "Not booked"}</div></div>
      ${HOUSES.map(h => `<div class="row"><div class="l"><b>${h.name}</b><span>${h.town}</span></div><div class="r">${g[h.roomKey] || "Room to be drawn"}</div></div>`).join("")}
    </div></div>

    <div class="block"><h3>Your rounds</h3><div class="sheet">
      ${DAYS.filter(d => roundOf(d)).map(d => { const id = roundOf(d), c = COURSES[id], cad = wantsCaddie(g,id), chosen = id in g.caddie;
        return `<div class="row"><div class="l"><b>${c.name}</b><span>${d.dow}, Sep ${d.d}. ${c.tee || "Tee time to come"}. ${!c.caddie ? "No caddie" : (chosen ? (cad?"Caddie":"No caddie") : (cad?"Caddie assumed":"No caddie assumed"))}.</span></div>
        <div class="r num">${$u(usd(allIn(c,cad)))}</div></div>`; }).join("")}
    </div>${warn}</div>

    <div class="block"><h3>Your estimated cost</h3><div class="sheet">
      <div class="row"><div class="l"><b>Flights</b><span>Rough estimate; you book your own</span></div><div class="r num">${$u(TRIP.flightUSD)}</div></div>
      <div class="row"><div class="l"><b>Houses and van</b><span>Your one-eighth share</span></div><div class="r num">${$u(sharedUSD())}</div></div>
      <div class="row"><div class="l"><b>Golf</b><span>Six rounds with your caddie choices</span></div><div class="r num">${$u(golf)}</div></div>
      <div class="row total"><div class="l"><b>Estimated total</b></div><div class="r num">${$u(total)}</div></div>
    </div>
    <p class="note">${(() => { const b = ledger().by[g.id]; return "Shared expenses logged so far: you've fronted "+$u(b.paid)+" and your share is "+$u(b.share)+"."; })()} Excludes food, drinks and travel insurance. The full breakdown is on the Costs tab.</p></div>`;
}

  <div class="sheet">${DAYS.map(d => { const id = roundOf(d), c = id && COURSES[id];
    const plan = d.slot ? [(slotOpen(id) ? "Course pending the group vote. " : "") + c.about, c.rules].filter(Boolean).concat(d.plan) : d.plan;
    return `<div class="day"><div class="dt"><span>${d.dow}</span><b>${d.d}</b><span>Sep</span></div><div>

}

}

  <p class="lede" style="margin-bottom:14px">These two are for all eight of us to decide. Tap an option to see what it does to the itinerary and to your cost. It's a what-if; tell ${TRIP.organiser} your actual vote.</p>

const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nameOf = id => (GOLFERS.find(g => g.id === id) || {name:id}).name;
const niceDate = d => new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const toUSD = e => e.currency === "GBP" ? Number(e.amount) * TRIP.rate : Number(e.amount);
const money = e => (e.currency === "GBP" ? "£" : "$") + Number(e.amount).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
const sbOn = () => !!(SUPABASE.url && SUPABASE.key);
const allExpenses = () => (sbOn() && S.x.loaded && !S.x.error) ? S.x.rows : SEED_EXPENSES;

function ledger(){
  const by = {}; GOLFERS.forEach(g => by[g.id] = {paid:0, share:0});
  allExpenses().forEach(e => { const split = (e.split_among || []).filter(id => by[id]); if(!split.length) return;
    const v = toUSD(e); if(by[e.paid_by]) by[e.paid_by].paid += v; split.forEach(id => by[id].share += v / split.length); });
  const owe = [], owed = [];
  GOLFERS.forEach(g => { const n = by[g.id].paid - by[g.id].share; by[g.id].net = n; if(n < -0.5) owe.push([g.id,-n]); if(n > 0.5) owed.push([g.id,n]); });
  owe.sort((a,b) => b[1]-a[1]); owed.sort((a,b) => b[1]-a[1]);
  const pays = []; let i = 0, j = 0;
  while(i < owe.length && j < owed.length){ const amt = Math.min(owe[i][1], owed[j][1]);
    if(amt > 0.5) pays.push([owe[i][0], owed[j][0], amt]); owe[i][1] -= amt; owed[j][1] -= amt;
    if(owe[i][1] < 0.5) i++; if(owed[j][1] < 0.5) j++; }
  return {by, pays};
}

async function sb(path, opts){
  const r = await fetch(SUPABASE.url.replace(/\/$/,"")+"/rest/v1/"+path, Object.assign({headers:{apikey:SUPABASE.key, Authorization:"Bearer "+SUPABASE.key, "Content-Type":"application/json"}}, opts || {}));
  const body = await r.json().catch(() => null);
  if(!r.ok) throw new Error((body && body.message) || "Request failed ("+r.status+")");
  return body;
}
async function loadExpenses(){
  if(!sbOn()) return;
  try{ S.x.rows = await sb("expenses?select=*&order=spent_on.asc,created_at.asc"); S.x.error = ""; }
  catch(e){ S.x.error = "Couldn't load expenses added by the group. Showing the house deposits only."; }
  S.x.loaded = true; draw();
}

function expenses(){
  const ed = S.x.edit ? S.x.rows.find(r => r.id === S.x.edit) : null, admin = S.x.role === "admin";
  const L = ledger(), list = allExpenses().slice().sort((a,b) => a.spent_on < b.spent_on ? 1 : -1), g = me();
  const total = list.reduce((s,e) => s + toUSD(e), 0);
  let entry;
  if(!sbOn()) entry = `<div class="sheet pad"><p>Expense entry isn't switched on yet. Once it is, anyone with the group code can add an expense here.</p></div>`;
  else if(!S.x.code) entry = `<form class="sheet pad" id="codeForm"><label class="field"><span>Group or admin code</span><input name="code" autocomplete="off" autocapitalize="off" required></label>
      <button class="btn" ${S.x.busy?"disabled":""}>Unlock expense entry</button>${S.x.msg ? `<p class="msg">${esc(S.x.msg)}</p>` : ""}</form>`;
  else if(!S.x.form) entry = `<div class="sheet pad"><button class="btn" data-act="openForm">Add an expense</button>${S.x.msg ? `<p class="msg">${esc(S.x.msg)}</p>` : ""}</div>`;
  else entry = `<form class="sheet pad" id="expForm">
      <label class="field"><span>What was it?</span><input name="description" maxlength="80" placeholder="Groceries, Tarbolton" value="${ed ? esc(ed.description) : ""}" required></label>
      <div class="two"><label class="field"><span>Amount</span><input name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" value="${ed ? Number(ed.amount) : ""}" required></label>
      <label class="field"><span>Currency</span><select name="currency"><option value="GBP">Pounds (£)</option><option value="USD" ${ed && ed.currency==="USD"?"selected":""}>US dollars ($)</option></select></label></div>
      <div class="two"><label class="field"><span>Paid by</span><select name="paid_by">${GOLFERS.map(x => `<option value="${x.id}" ${(ed ? ed.paid_by===x.id : g && g.id===x.id)?"selected":""}>${x.name}</option>`).join("")}</select></label>
      <label class="field"><span>Date</span><input name="spent_on" type="date" value="${ed ? ed.spent_on : new Date().toLocaleDateString("en-CA")}" required></label></div>
      <label class="field"><span>Category</span><select name="category">${CATEGORIES.map(c => `<option ${ed && ed.category===c?"selected":""}>${c}</option>`).join("")}</select></label>
      <div class="field"><span>Split between</span><div class="chips">${GOLFERS.map(x => `<label><input type="checkbox" name="split" value="${x.id}" ${!ed || ed.split_among.includes(x.id) ? "checked" : ""}>${x.name}</label>`).join("")}</div>
        <p class="note"><button type="button" class="btn ghost" data-act="splitAll">Everyone</button> <button type="button" class="btn ghost" data-act="splitNone">Clear</button></p></div>
      <button class="btn" ${S.x.busy?"disabled":""}>${ed ? "Save changes" : "Save expense"}</button> <button type="button" class="btn ghost" data-act="closeForm">Cancel</button>
      ${S.x.msg ? `<p class="msg">${esc(S.x.msg)}</p>` : ""}</form>`;

  return `<h2>Expenses</h2><p class="lede">Shared costs someone has fronted, and who owes whom. Totals are in US dollars at £1 = $${TRIP.rate.toFixed(2)}.</p>
  ${S.x.error ? `<p class="msg" style="margin:0 0 16px">${S.x.error}</p>` : ""}
  <div class="block" style="margin-top:0"><h3>To settle up</h3><div class="sheet">
    ${L.pays.length ? L.pays.map(p => `<div class="row"><div class="l"><b>${nameOf(p[0])} pays ${nameOf(p[1])}</b></div><div class="r num">${$u(p[2])}</div></div>`).join("") : `<div class="row"><div class="l">Everyone is square.</div></div>`}
  </div><p class="note">The fewest payments that clear every balance. No need to pay until ${TRIP.organiser} asks.</p></div>

  <div class="block"><h3>Where everyone stands</h3><div class="sheet">
    ${GOLFERS.map(x => { const b = L.by[x.id], n = Math.round(b.net);
      return `<div class="row"><div class="l"><b>${x.name}</b><span>Fronted ${$u(b.paid)}, share ${$u(b.share)}</span></div><div class="r num ${n>0?"pos":n<0?"neg":""}">${n>0 ? "Owed "+$u(n) : n<0 ? "Owes "+$u(-n) : "Square"}</div></div>`; }).join("")}
    <div class="row total"><div class="l"><b>Logged so far</b></div><div class="r num">${$u(total)}</div></div>
  </div></div>

  <div class="block" id="entry"><h3>${ed ? "Edit expense" : "Add an expense"}</h3>${entry}${S.x.code ? `<p class="note">${admin ? "Signed in as admin: you can edit and delete." : "Signed in with the group code."} <button class="who" style="color:inherit" data-act="signOut">Sign out</button></p>` : ""}</div>

  <div class="block"><h3>Every expense</h3><div class="sheet">
    ${list.map(e => { const n = (e.split_among||[]).length;
      return `<div class="row"><div class="l"><b>${esc(e.description)}</b><span>${niceDate(e.spent_on)}. Paid by ${esc(nameOf(e.paid_by))}. ${n === GOLFERS.length ? "Split between all eight" : "Split between "+e.split_among.map(nameOf).map(esc).join(", ")}.</span></div>
      <div class="r num">${money(e)}<small>${e.currency === "GBP" ? $u(toUSD(e))+", " : ""}${$u(toUSD(e)/Math.max(n,1))} each</small>${admin && S.x.rows.includes(e) ? `<small style="margin-top:6px"><button class="btn ghost" style="padding:4px 10px" data-act="editExp" data-id="${e.id}">Edit</button> <button class="btn ghost" style="padding:4px 10px" data-act="delExp" data-id="${e.id}">Delete</button></small>` : ""}</div></div>`; }).join("")}
  </div></div>

  <div class="block"><h3>Coming up</h3><div class="sheet">
    ${HOUSES.map(h => `<div class="row"><div class="l"><b>${h.name} balance</b><span>Charges automatically ${h.balanceDate}. It will be added here once paid.</span></div><div class="r num">${$g(h.balance)}<small>${$u(usd(h.balance/TRIP.size))} each</small></div></div>`).join("")}
  </div></div>`;
}

function signOut(){ const x = S.x; x.code = ""; x.role = ""; x.form = false; x.edit = null; try{ sessionStorage.removeItem("scot28code"); sessionStorage.removeItem("scot28role"); }catch(_){} }
async function delExpense(id){
  const e = S.x.rows.find(r => r.id === id); if(!e || !confirm('Delete "'+e.description+'" ('+money(e)+')? This can\'t be undone.')) return;
  try{ await sb("rpc/delete_expense", {method:"POST", body:JSON.stringify({p_code:S.x.code, p_id:id})}); S.x.edit = null; S.x.form = false; S.x.msg = "Deleted. Balances are updated."; await loadExpenses(); }
  catch(err){ S.x.msg = "Not deleted: "+err.message; draw(); }
}
document.addEventListener("submit", async e => {
  const f = e.target; if(f.id !== "codeForm" && f.id !== "expForm") return;
  e.preventDefault(); const d = new FormData(f), x = S.x;
  if(f.id === "codeForm"){
    const code = String(d.get("code")).trim(); x.busy = true; x.msg = ""; draw();
    try{ const role = await sb("rpc/code_role", {method:"POST", body:JSON.stringify({p_code:code})});
      if(role === "admin" || role === "entry"){ x.code = code; x.role = role; x.form = role === "entry"; try{ sessionStorage.setItem("scot28code", code); sessionStorage.setItem("scot28role", role); }catch(_){} } else x.msg = "That code isn't right. Ask "+TRIP.organiser+" for the current one."; }
    catch(err){ x.msg = "Couldn't check the code: "+err.message; }
    x.busy = false; draw(); return;
  }
  const split = d.getAll("split");
  if(!split.length){ x.msg = "Choose at least one person to split this between."; const m = f.querySelector(".msg"); if(m) m.textContent = x.msg; else f.insertAdjacentHTML("beforeend", `<p class="msg">${x.msg}</p>`); return; }
  const btn = f.querySelector("button.btn:not(.ghost)"); btn.disabled = true;
  try{
    await sb(x.edit ? "rpc/update_expense" : "rpc/add_expense", {method:"POST", body:JSON.stringify({...(x.edit ? {p_id:x.edit} : {p_added_by:S.who || ""}), p_code:x.code, p_spent_on:d.get("spent_on"), p_description:String(d.get("description")).trim(),
      p_amount:Number(d.get("amount")), p_currency:d.get("currency"), p_paid_by:d.get("paid_by"), p_split_among:split, p_category:d.get("category")})});
    x.form = false; x.edit = null; x.msg = "Saved. Balances are updated."; await loadExpenses();
  }catch(err){
    btn.disabled = false; const wrong = /code/i.test(err.message);
    if(wrong){ signOut(); x.msg = "That code no longer works. Enter the current one."; draw(); }
    else { const m = f.querySelector(".msg"), t = "Not saved: "+err.message; if(m) m.textContent = t; else f.insertAdjacentHTML("beforeend", `<p class="msg">${esc(t)}</p>`); }
  }
});

const RENDER = {home, itinerary, golf, travel, costs, expenses, decisions, guide};
function draw(){
  $("tabs").innerHTML = TABS.map(t => `<button class="tab" role="tab" aria-selected="${S.tab===t[0]}" data-tab="${t[0]}">${t[0]==="home" && me() ? me().name+"'s trip" : t[1]}</button>`).join("");
  TABS.forEach(t => { const p = $("p-"+t[0]); p.classList.toggle("on", S.tab === t[0]); p.innerHTML = S.tab === t[0] ? RENDER[t[0]]() : ""; });
  $("whoBtn").textContent = me() ? "Not "+me().name+"?" : "";
  const sel = document.querySelector(".tab[aria-selected=true]"); if(sel && sel.scrollIntoView) sel.scrollIntoView({block:"nearest", inline:"center"});
}
function remember(){ try{ localStorage.setItem("scot28who", S.who || ""); }catch(e){} }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"), w = e.target.closest("[data-who]"), o = e.target.closest("[data-slot]");
  if(t){ S.tab = t.dataset.tab; S.x.msg = ""; history.replaceState(null, "", "#"+S.tab); window.scrollTo(0,0); }
  else if(w){ S.who = w.dataset.who; remember(); }
  else if(o){ S[o.dataset.slot] = o.dataset.id; }
  else if(e.target.closest("[data-act]")){ const a = e.target.closest("[data-act]").dataset.act;
    if(a === "splitAll" || a === "splitNone"){ document.querySelectorAll("#expForm [name=split]").forEach(c => c.checked = a === "splitAll"); return; }
    const id = e.target.closest("[data-act]").dataset.id; S.x.msg = "";
    if(a === "delExp"){ delExpense(id); return; }
    if(a === "signOut") signOut();
    else if(a === "editExp"){ S.x.edit = id; S.x.form = true; draw(); const el = $("entry"); if(el && el.scrollIntoView) el.scrollIntoView({block:"start"}); return; }
    else { S.x.form = a === "openForm"; S.x.edit = null; } }
  else if(e.target.id === "whoBtn"){ S.who = null; S.tab = "home"; remember(); }
  else return;
  draw();
});

(function init(){
  const q = new URLSearchParams(location.search).get("g");
  let saved = ""; try{ saved = localStorage.getItem("scot28who") || ""; }catch(e){}
  const id = (q || saved).toLowerCase();
  if(GOLFERS.some(g => g.id === id)){ S.who = id; if(q) remember(); }
  const h = location.hash.slice(1); if(RENDER[h]) S.tab = h;
  $("updated").textContent = TRIP.updated;
  try{ S.x.code = sessionStorage.getItem("scot28code") || ""; S.x.role = sessionStorage.getItem("scot28role") || ""; }catch(e){}
  draw();
  loadExpenses();
})();
</script>
</body>
