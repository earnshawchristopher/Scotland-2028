<style>
  :root{
    color-scheme:light dark;
    --sea:#0e1e2b;      /* North Sea ink: dark panels */
    --sea2:#172c3c;
    --haar:#edf0ee;     /* sea mist: page */
    --paper:#fafbf9;
    --rule:#d5dbd7;
    --ink:#14212b;
    --muted:#4b5861;
    --gold:#8a6b29;     /* gold leaf on light */
    --leaf:#d6b877;     /* gold leaf on dark */
    --green:#2e5a47;
    --heather:#6b4a6e;
    --field:#fff;       /* inputs */
    --pressed:#f4eff5;  /* chosen or pressed option */
    --btn:#0e1e2b;
    --btnink:#fff;
    --total:#0e1e2b;
    --display:"Marcellus","Iowan Old Style",Georgia,serif;
    --body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --haar:#0a141c;
      --paper:#13222e;
      --rule:#2b3d4a;
      --ink:#e8edea;
      --muted:#a7b4bc;
      --gold:#d6b877;
      --green:#86c7a8;
      --heather:#cfa9d2;
      --field:#0d1a24;
      --pressed:#2b2330;
      --btn:#d6b877;
      --btnink:#0e1e2b;
      --total:#1c3447;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--haar);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-wrap:break-word}
  h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15}
  h2{font-size:30px;margin-bottom:6px}
  h3{font-size:21px}
  p{margin:0}
  button{font:inherit;color:inherit;touch-action:manipulation}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .wrap{max-width:720px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
  .num{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .small{font-size:14px}
  .link{background:none;border:0;padding:0 2px;min-height:44px;color:inherit;font-size:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

  /* masthead + tabs */
  .mast{background:var(--sea);color:#eef2f0;padding-top:env(safe-area-inset-top)}
  .mast .wrap{display:flex;justify-content:space-between;align-items:center;min-height:52px}
  .mast .name{font-family:var(--display);font-size:22px;letter-spacing:.02em;color:var(--leaf)}
  .mast .who{font-size:14px;color:#c3ced4;background:none;border:0;padding:0 0 0 16px;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .mast .who:empty{display:none}
  .tabs{position:sticky;top:0;z-index:10;background:var(--sea);border-top:1px solid #24394a}
  .tabs .wrap{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding-top:0;padding-bottom:0}
  .tabs .wrap::-webkit-scrollbar{display:none}
  .tab{background:none;border:0;padding:13px 0 11px;color:#a9b7c0;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;font-weight:500;font-size:15px}
  .tab[aria-selected=true]{color:#fff;border-bottom-color:var(--leaf)}

  /* phone navigation: thumb-reach bar, with the less-used sections behind More */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--sea);border-top:1px solid #24394a;
    padding:0 max(4px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px,env(safe-area-inset-left))}
  .bar button{flex:1;min-width:0;min-height:58px;background:none;border:0;border-top:2px solid transparent;margin-top:-1px;color:#a9b7c0;font-size:12px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
  .bar button[aria-current=page],.bar button.cur,.bar button[aria-expanded=true]{color:#fff;border-top-color:var(--leaf)}
  .bar button:active{color:#fff;background:var(--sea2)}
  .bar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .scrim{position:fixed;inset:0;z-index:18;background:rgba(5,12,18,.55)}
  .more{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:19;background:var(--sea2);color:#eef2f0;border-radius:14px 14px 0 0;
    padding:6px max(14px,env(safe-area-inset-right)) 6px max(14px,env(safe-area-inset-left));box-shadow:0 -8px 30px rgba(0,0,0,.35)}
  .more button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid #2b4152;padding:13px 6px;min-height:60px;cursor:pointer;color:#eef2f0}
  .more button:first-child{border-top:0}
  .more button b{display:block;font-family:var(--display);font-weight:400;font-size:19px}
  .more button span{display:block;font-size:14px;color:#b4c1c9}
  .more button[aria-current=page] b{color:var(--leaf)}
  .more button:active{background:#1f3a4d}
  @media(min-width:760px){#nav{display:none}}
  @media(max-width:759.98px){
    .tabs{display:none}
    footer{padding-bottom:calc(84px + env(safe-area-inset-bottom))!important}
  }

  main.wrap{padding-top:24px;padding-bottom:40px}
  .panel{display:none}.panel.on{display:block}
  .lede{color:var(--muted);margin-bottom:22px;max-width:56ch}
  .block{margin-top:34px}
  .block>h3{margin-bottom:10px}

  /* the honours board: the one loud thing */
  .board{background:var(--sea);color:var(--leaf);padding:8px;margin-bottom:28px}
  .board .inner{border:1px solid var(--leaf);outline:1px solid var(--leaf);outline-offset:-5px;padding:30px 24px 26px}
  .board h1{font-size:clamp(36px,10.5vw,58px);letter-spacing:.03em;text-align:center}
  .board .dates{text-align:center;color:#c8d0d4;margin:8px 0 22px;font-size:15px}
  .board ol{list-style:none;margin:0;padding:0;font-family:var(--display);font-size:17px}
  .board li{display:flex;align-items:baseline;gap:8px;padding:5px 0}
  .board li .d{flex:none;width:74px}
  .board li .dots{flex:1;border-bottom:1px dotted #8a7a52;transform:translateY(-4px);min-width:14px}
  .board li .c{text-align:right}
  .board li.tbd .c{font-style:italic;color:#c8d0d4}
  .board .foot{text-align:center;margin-top:20px;font-size:14px;color:#c8d0d4}
  /* once a golfer is picked, the board shrinks to a countdown so their to-dos lead */
  .board.slim{padding:6px;margin-bottom:22px}
  .board.slim .inner{padding:16px 16px 14px}
  .board.slim h1{font-size:clamp(22px,6.6vw,30px);letter-spacing:.02em}
  .board.slim .dates{margin:5px 0 0;font-size:14px}

  /* quiet surfaces */
  .sheet{background:var(--paper);border:1px solid var(--rule);border-radius:3px}
  .row{display:flex;justify-content:space-between;gap:16px;padding:13px 16px;border-top:1px solid var(--rule);align-items:baseline}
  .row:first-child{border-top:0}
  .row .l{flex:1 1 0;min-width:38%}
  .row .l b{font-weight:600}
  .row .l span{display:block;color:var(--muted);font-size:14px}
  .row .r{text-align:right;flex:0 1 auto;max-width:62%;font-weight:600;overflow-wrap:anywhere}
  .row .r small{display:block;font-weight:400;color:var(--muted);font-size:14px}
  .row.total{background:var(--total);color:#fff;border-radius:0 0 2px 2px}
  .row.total .r{font-family:var(--display);font-size:26px;color:var(--leaf);font-weight:400}
  /* rows whose value is free text (flights, rooms) stack on a phone instead of squeezing */
  @media(max-width:520px){
    .row.stack{display:block}
    .row.stack .r{text-align:left;max-width:none;margin-top:4px}
  }
  .pad{padding:16px}

  .tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
  .tag.ok{color:var(--green)} .tag.wait{color:var(--gold)} .tag.vote{color:var(--heather)}

  /* who are you */
  .pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media(min-width:520px){.pick{grid-template-columns:repeat(4,1fr)}}
  .pick button{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:14px 12px;text-align:left;cursor:pointer}
  .pick button b{display:block;font-family:var(--display);font-weight:400;font-size:20px}
  .pick button span{font-size:14px;color:var(--muted)}
  .pick button:active{border-color:var(--gold);background:var(--pressed)}
  @media(hover:hover){.pick button:hover{border-color:var(--gold)}}

  /* itinerary */
  .day{display:grid;grid-template-columns:58px 1fr;gap:16px;padding:18px 16px;border-top:1px solid var(--rule)}
  .day:first-child{border-top:0}
  .day>div{min-width:0}
  .day .dt{font-family:var(--display);text-align:center;line-height:1.1}
  .day .dt b{display:block;font-size:30px;font-weight:400}
  .day .dt span{font-size:14px;color:var(--muted)}
  .day h3{font-size:20px}
  .day .base{font-size:14px;color:var(--green);font-weight:600;margin-bottom:2px}
  .day ul{margin:8px 0 0;padding:0;list-style:none;font-size:15px;color:var(--muted)}
  .day li{padding:2px 0 2px 14px;position:relative}
  .day li::before{content:"";position:absolute;left:0;top:12px;width:6px;height:1px;background:var(--gold)}
  .tee{display:inline-block;margin-top:6px;font-size:14px;font-weight:600}
  @media(max-width:380px){.day{grid-template-columns:46px 1fr;gap:12px}}

  /* courses */
  .course{padding:18px 16px;border-top:1px solid var(--rule)}
  .course:first-child{border-top:0}
  .course .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .course .price{font-family:var(--display);font-size:22px;white-space:nowrap}
  .course .when{font-size:14px;color:var(--green);font-weight:600}
  .course p{font-size:15px;color:var(--muted);margin-top:6px}
  .fees{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:12px;font-size:14px}
  .fees div{background:var(--paper);padding:8px 10px;min-width:0}
  .fees b{display:block;font-weight:600}
  .fees span{color:var(--muted);font-size:14px}

  .opt{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--paper);border:0;border-top:1px solid var(--rule);padding:14px 16px;cursor:pointer;align-items:center}
  .opt:first-child{border-top:0}
  .opt>span:first-child{min-width:0;flex:1}
  .opt b{font-weight:600}
  .opt small{display:block;color:var(--muted);font-size:14px;line-height:1.4;margin-top:2px}
  .opt .p{font-family:var(--display);font-size:19px;white-space:nowrap}
  .opt:active{background:var(--pressed)}
  .opt[aria-pressed=true]{box-shadow:inset 3px 0 0 var(--heather);background:var(--pressed)}
  .opt[disabled]{cursor:default;color:inherit}
  .votebox{border-color:var(--heather)}
  .votebox .head{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:10px}

  /* decisions: one card per decision, deadline in the header, results inside each option */
  .vcard{margin-bottom:14px}
  .vcard .head{align-items:flex-start}
  .due{font-size:14px;font-weight:600;color:var(--gold);margin-top:3px}
  .due.soon,.due.over{color:var(--heather)}
  .why{padding:12px 16px;font-size:15px;color:var(--muted);border-bottom:1px solid var(--rule)}
  .meter{display:block;height:4px;background:var(--rule);border-radius:2px;margin-top:8px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--heather);border-radius:2px}
  .opt small.votes{color:var(--ink);margin-top:5px}
  .opt .mine{font-size:13px;font-weight:600;color:var(--heather)}
  .vfoot{padding:11px 16px;border-top:1px solid var(--rule);font-size:14px;color:var(--muted)}
  .vfoot b{color:var(--ink);font-weight:600}
  .vbody{padding:14px 16px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .seg button{background:var(--field);border:1px solid var(--rule);border-radius:3px;min-height:54px;padding:8px 10px;cursor:pointer;text-align:center;line-height:1.3}
  .seg button b{display:block;font-weight:600}
  .seg button small{display:block;color:var(--muted);font-size:14px}
  .seg button[aria-pressed=true]{border-color:var(--heather);background:var(--pressed);box-shadow:inset 0 0 0 1px var(--heather)}
  .seg button:active{background:var(--pressed)}
  .seg button[disabled]{cursor:default;color:inherit}
  .rnd{padding:14px 16px;border-top:1px solid var(--rule)}
  .rnd:first-of-type{border-top:0}
  .rnd .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:8px}
  .rnd .t b{font-weight:600}
  .rnd .t span{font-size:14px;color:var(--muted);text-align:right}
  .rnd .tally{font-size:14px;color:var(--muted);margin-top:8px}
  .banner{background:var(--pressed);border:1px solid var(--heather);border-radius:3px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .banner p{flex:1 1 220px;font-size:15px}
  .banner .btn{margin-top:0}
  .lockbar{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;margin-bottom:22px}
  .lockbar p{flex:1 1 200px;font-size:15px}
  .lockbar .btn{margin-top:0}
  #staleToast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:17;background:var(--leaf);color:#0e1e2b;border:0;border-radius:99px;
    padding:0 18px;min-height:44px;font-weight:600;font-size:14px;box-shadow:0 6px 22px rgba(0,0,0,.3);cursor:pointer;white-space:nowrap}
  body.stale:not([data-view=decisions]) #staleToast{display:block}
  @media(max-width:759.98px){#staleToast{bottom:calc(70px + env(safe-area-inset-bottom))}}
  body.stale .tab[data-tab=decisions]::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--leaf);margin-left:6px;vertical-align:middle}
  .bar button{position:relative}
  body.stale .bar button[data-more]::after{content:"";position:absolute;top:9px;left:calc(50% + 10px);width:8px;height:8px;border-radius:50%;background:var(--leaf)}

  .check{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--rule);align-items:flex-start}
  .check:first-child{border-top:0}
  .check>div{min-width:0}
  .check i{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--gold);margin-top:2px;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
  .check.done i{background:var(--green);border-color:var(--green)}
  .check b{font-weight:600;display:block}
  .check span{font-size:14px;color:var(--muted)}

  .field{display:block;margin-bottom:12px}
  .field>span{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
  input,select{font:inherit;width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--rule);border-radius:3px;background:var(--field);color:var(--ink)}
  .btn{background:var(--btn);color:var(--btnink);border:0;border-radius:3px;min-height:46px;padding:11px 18px;font-weight:600;cursor:pointer}
  .btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
  .btn.sm{min-height:44px;padding:0 14px;margin-top:8px}
  .btn:active{opacity:.75}
  .btn.ghost:active{background:var(--pressed);opacity:1}
  .btn[disabled]{opacity:.5;cursor:default}
  .acts{display:flex;flex-wrap:wrap;gap:8px}
  .chips{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .chips label{display:flex;gap:10px;align-items:center;min-height:46px;border:1px solid var(--rule);border-radius:3px;padding:8px 10px;background:var(--field);cursor:pointer}

    return {id, label:c.name, note:c.about + (c.rules ? " "+c.rules : ""), price:$u(usd(allIn(c, wantsCaddie(me(), id))))}; });
  return (v.options || []).map(o => Object.assign({}, o, {note:o.note.replace("PROVIDER_COST",
    "From about "+$g(OLD_COURSE.providerLow)+" to "+$g(OLD_COURSE.providerHigh)+" each at 2027 prices, so at least "+$u(usd(OLD_COURSE.providerLow - OLD_COURSE.packageGBP))+" to "+$u(usd(OLD_COURSE.providerHigh - OLD_COURSE.packageGBP))+" more per person than this budget.")}));
}
/* submitted answers only; unsaved edits never count */
function tally(key){
  const by = {}; let n = 0;
  V.rows.forEach(r => { const c = r.choices && r.choices[key]; if(c && GOLFERS.some(g => g.id === r.golfer_id)){ (by[c] = by[c] || []).push(r.golfer_id); n++; } });
  return {by, n};
}
/* The state of one poll.
   closed = the organiser has booked or settled it in the data block: nothing can change it.
   final  = more than half the group has locked in the same option. Until the deadline people
            can still change their answer, and if support drops below a majority it re-opens.
   lapsed = the deadline passed without a majority: voting is closed and the organiser decides.
   open   = still collecting answers.                                                          */
function verdict(v){
  const t = tally(v.id), over = pastDue(v.by);
  const closed = v.slot ? SLOTS[v.slot].decided : v.closed, pick = v.slot ? SLOTS[v.slot].pick : v.pick;
  const ranked = voteOptions(v).map(o => [o.id, (t.by[o.id] || []).length]).sort((a,b) => b[1] - a[1]);
  const top = ranked[0], tie = ranked.length > 1 && ranked[1][1] === top[1];
  if(closed) return {state:"closed", pick, frozen:true, t};
  if(top[1] >= NEED) return {state:"final", pick:top[0], frozen:over, t};
  if(over) return {state:"lapsed", pick:null, lead:(top[1] && !tie) ? top[0] : null, frozen:true, t};
  return {state:"open", pick:null, lead:(top[1] && !tie) ? top[0] : null, frozen:false, t};
}
const frozen = v => v.kind === "poll" ? verdict(v).frozen : (v.closed || pastDue(v.by));
const slotPick = k => verdict(VOTES.find(v => v.slot === k)).pick;
const slotOpen = id => Object.keys(SLOTS).some(k => !slotPick(k) && SLOTS[k].options.includes(id));
/* Which Ayrshire courses the site shows: the settled one if there is one, otherwise the
   golfer's own what-if from the Golf tab, their own vote, or the pencilled-in pick.           */
function syncSlots(){
  Object.keys(SLOTS).forEach(k => { const p = slotPick(k);
    S[k] = p || (S.touched[k] ? S[k] : (V.draft[k] && SLOTS[k].options.includes(V.draft[k]) ? V.draft[k] : SLOTS[k].pick)); });
}
function labelOf(key, val){
  if(!val) return "";
  if(key.startsWith("cad_")) return val === "yes" ? "Caddie" : "No caddie";
  const o = voteOptions(voteById(key)).find(x => x.id === val); return o ? o.label : val;
}

function staleHTML(){
  if(!V.stale.length) return "";

  const text = others.length ? listOf(others)+" "+(others.length > 1 ? "have" : "has")+" changed selections since this page loaded. The results below are out of date."

const niceDate = d => new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const toUSD = e => e.currency === "GBP" ? Number(e.amount) * TRIP.rate : Number(e.amount);
const money = e => (e.currency === "GBP" ? "£" : "$") + Number(e.amount).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});

function ledger(){
  const by = {}; GOLFERS.forEach(g => by[g.id] = {paid:0, share:0});
  allExpenses().forEach(e => { const split = (e.split_among || []).filter(id => by[id]); if(!split.length) return;
    const v = toUSD(e); if(by[e.paid_by]) by[e.paid_by].paid += v; split.forEach(id => by[id].share += v / split.length); });
  const owe = [], owed = [];
  GOLFERS.forEach(g => { const n = by[g.id].paid - by[g.id].share; by[g.id].net = n; if(n < -0.5) owe.push([g.id,-n]); if(n > 0.5) owed.push([g.id,n]); });
  owe.sort((a,b) => b[1]-a[1]); owed.sort((a,b) => b[1]-a[1]);
  const pays = []; let i = 0, j = 0;
  while(i < owe.length && j < owed.length){ const amt = Math.min(owe[i][1], owed[j][1]);
    if(amt > 0.5) pays.push([owe[i][0], owed[j][0], amt]); owe[i][1] -= amt; owed[j][1] -= amt;
    if(owe[i][1] < 0.5) i++; if(owed[j][1] < 0.5) j++; }
  return {by, pays};
}

async function sb(path, opts){
  const r = await fetch(SUPABASE.url.replace(/\/$/,"")+"/rest/v1/"+path, Object.assign({headers:{apikey:SUPABASE.key, Authorization:"Bearer "+SUPABASE.key, "Content-Type":"application/json"}}, opts || {}));
  const body = await r.json().catch(() => null);
  if(!r.ok) throw new Error((body && body.message) || "Request failed ("+r.status+")");
  return body;
}

/* ---------- decisions: loading, drafts, locking in, and noticing other people's changes ----------
   Each golfer has ONE row in the database holding all their answers. Locking in replaces that
   row, so the newest submission always wins and the polls only ever count locked-in answers.
   Edits made on this device are a draft (kept in this browser) until the golfer locks in.      */
const draftKey = () => "scot28draft:" + S.who;
function loadDraft(){
  V.draft = Object.assign({}, submitted());
  if(!S.who) return;
  try{
    const d = JSON.parse(localStorage.getItem(draftKey()) || "null"), r = myRow();
    if(!d) return;
    if(d.base === (r ? r.updated_at : "")){ KEYS.forEach(k => { const v = voteById(k); if(d.choices[k] && !frozen(v)) V.draft[k] = d.choices[k]; }); }
    else { localStorage.removeItem(draftKey()); V.note = "Your selections were changed from another device after you started editing here, so this shows the latest ones."; }
  }catch(_){}
}
function saveDraft(){
  try{ if(dirtyKeys().length) localStorage.setItem(draftKey(), JSON.stringify({base:(myRow() || {}).updated_at || "", choices:V.draft})); else localStorage.removeItem(draftKey()); }catch(_){}
}
function setVote(key, val){
  const v = voteById(key); if(!S.who || !v || frozen(v)) return;
  V.draft[key] = val; V.msg = ""; V.note = "";
  if(v.slot){ S.touched[v.slot] = false; }
  saveDraft();
}

  if(!sbOn()) return;

  catch(e){ V.rows = []; V.error = "Couldn't load the group's answers ("+e.message+"). Check your connection and try again."; }
  V.loaded = true; V.stale = []; loadDraft();

/* A light check, run when the page comes back into view, regains its connection, or once a
   minute: has anyone locked in since this page loaded? If so, prompt rather than silently
   re-drawing under the reader's thumb.                                                        */
async function checkFresh(){
  if(!sbOn() || document.hidden || V.checking) return;
  if(!V.loaded) return;
  if(V.error){ if(S.tab === "decisions") loadBallots(); return; }
  V.checking = true;
  try{

    V.rows.forEach(r => have[r.golfer_id] = r.updated_at); now.forEach(r => there[r.golfer_id] = r.updated_at);
    V.stale = now.filter(r => have[r.golfer_id] !== r.updated_at).map(r => r.golfer_id).concat(V.rows.filter(r => !(r.golfer_id in there)).map(r => r.golfer_id));
    paintStale();
  }catch(_){}
  V.checking = false;
}

    ${GOLFERS.map(x => { const b = L.by[x.id], n = Math.round(b.net);
      return `<div class="row"><div class="l"><b>${x.name}</b><span>Fronted ${$u(b.paid)}, share ${$u(b.share)}</span></div><div class="r num ${n>0?"pos":n<0?"neg":""}">${n>0 ? "Owed "+$u(n) : n<0 ? "Owes "+$u(-n) : "Square"}</div></div>`; }).join("")}
    <div class="row total"><div class="l"><b>Logged so far</b></div><div class="r num">${$u(total)}</div></div>
  </div></div>

  <div class="block" id="entry"><h3>${ed ? "Edit expense" : "Add an expense"}</h3>${entry}${S.x.code ? `<p class="note">${admin ? "Signed in as admin: you can edit and delete." : "Signed in with the group code."} <button class="link" data-act="signOut">Sign out</button></p>` : ""}</div>

  <div class="block"><h3>Every expense</h3><div class="sheet">
    ${list.map(e => { const n = (e.split_among||[]).length;
      return `<div class="row"><div class="l"><b>${esc(e.description)}</b><span>${niceDate(e.spent_on)}. Paid by ${esc(nameOf(e.paid_by))}. ${n === GOLFERS.length ? "Split between all eight" : "Split between "+e.split_among.map(nameOf).map(esc).join(", ")}.</span></div>
      <div class="r num">${money(e)}<small>${e.currency === "GBP" ? $u(toUSD(e))+", " : ""}${$u(toUSD(e)/Math.max(n,1))} each</small>${admin && S.x.rows.includes(e) ? `<small><button class="btn ghost sm" data-act="editExp" data-id="${e.id}">Edit</button> <button class="btn ghost sm" data-act="delExp" data-id="${e.id}">Delete</button></small>` : ""}</div></div>`; }).join("")}
  </div></div>

  <div class="block"><h3>Coming up</h3><div class="sheet">
    ${HOUSES.map(h => `<div class="row"><div class="l"><b>${h.name} balance</b><span>Charges automatically ${h.balanceDate}. It will be added here once paid.</span></div><div class="r num">${$g(h.balance)}<small>${$u(usd(h.balance/TRIP.size))} each</small></div></div>`).join("")}
  </div></div>`;
}

function signOut(){ const x = S.x; x.code = ""; x.role = ""; x.form = false; x.edit = null;
  try{ sessionStorage.removeItem("scot28code"); sessionStorage.removeItem("scot28role"); localStorage.removeItem("scot28code"); localStorage.removeItem("scot28role"); }catch(_){} }
async function delExpense(id){
  const e = S.x.rows.find(r => r.id === id); if(!e || !confirm('Delete "'+e.description+'" ('+money(e)+')? This can\'t be undone.')) return;
  try{ await sb("rpc/delete_expense", {method:"POST", body:JSON.stringify({p_code:S.x.code, p_id:id})}); S.x.edit = null; S.x.form = false; S.x.msg = "Deleted. Balances are updated."; await loadExpenses(); }
  catch(err){ S.x.msg = "Not deleted: "+err.message; draw(); }
}
document.addEventListener("submit", async e => {
  const f = e.target; if(f.id !== "codeForm" && f.id !== "expForm") return;
  e.preventDefault(); const d = new FormData(f), x = S.x;
  if(f.id === "codeForm"){
    const code = String(d.get("code")).trim(); x.busy = true; x.msg = ""; draw();
    try{ const role = await sb("rpc/code_role", {method:"POST", body:JSON.stringify({p_code:code})});
      if(role === "admin" || role === "entry"){ keepCode(code, role); x.form = role === "entry"; } else x.msg = "That code isn't right. Ask "+TRIP.organiser+" for the current one."; }
    catch(err){ x.msg = "Couldn't check the code: "+err.message; }
    x.busy = false; draw(); return;
  }
  const split = d.getAll("split");
  if(!split.length){ x.msg = "Choose at least one person to split this between."; const m = f.querySelector(".msg"); if(m) m.textContent = x.msg; else f.insertAdjacentHTML("beforeend", `<p class="msg">${x.msg}</p>`); return; }
  const btn = f.querySelector("button.btn:not(.ghost)"); btn.disabled = true;
  try{
    await sb(x.edit ? "rpc/update_expense" : "rpc/add_expense", {method:"POST", body:JSON.stringify({...(x.edit ? {p_id:x.edit} : {p_added_by:S.who || ""}), p_code:x.code, p_spent_on:d.get("spent_on"), p_description:String(d.get("description")).trim(),
      p_amount:Number(d.get("amount")), p_currency:d.get("currency"), p_paid_by:d.get("paid_by"), p_split_among:split, p_category:d.get("category")})});
    x.form = false; x.edit = null; x.msg = "Saved. Balances are updated."; await loadExpenses();
  }catch(err){
    btn.disabled = false; const wrong = /code/i.test(err.message);
    if(wrong){ signOut(); x.msg = "That code no longer works. Enter the current one."; draw(); }
    else { const m = f.querySelector(".msg"), t = "Not saved: "+err.message; if(m) m.textContent = t; else f.insertAdjacentHTML("beforeend", `<p class="msg">${esc(t)}</p>`); }
  }
});
/* Lock in: checks the group code if this device doesn't have it yet, then replaces this
   golfer's whole row. Answers to anything already closed are sent as last submitted.          */
document.addEventListener("submit", async e => {
  const f = e.target; if(f.id !== "voteForm") return;
  e.preventDefault(); if(V.busy || !S.who) return;
  const d = new FormData(f); V.busy = true; V.msg = ""; draw();
  try{
    if(!S.x.code){
      const code = String(d.get("code") || "").trim(), role = await sb("rpc/code_role", {method:"POST", body:JSON.stringify({p_code:code})});
      if(role !== "admin" && role !== "entry"){ V.busy = false; V.msg = "That code isn't right. Ask "+TRIP.organiser+" for the current one."; draw(); return; }
      keepCode(code, role);
    }
    const sub = submitted(), choices = {};
    KEYS.forEach(k => { const val = frozen(voteById(k)) ? sub[k] : V.draft[k]; if(val) choices[k] = val; });
    await sb("rpc/submit_ballot", {method:"POST", body:JSON.stringify({p_code:S.x.code, p_golfer:S.who, p_choices:choices})});
    try{ localStorage.removeItem(draftKey()); }catch(_){}
    V.busy = false; V.msg = "Locked in. Everyone now sees your selections."; await loadBallots();
  }catch(err){
    V.busy = false;
    if(/code/i.test(err.message)){ signOut(); V.msg = "That code no longer works. Enter the current one and lock in again."; }
    else V.msg = "Not locked in: "+err.message+". Your selections are still saved on this device; try again when you have a connection.";
    draw();
  }
});

const RENDER = {home, itinerary, golf, travel, costs, expenses, decisions, guide};
function nav(){
  const inMore = MORE.some(m => m[0] === S.tab);
  return (S.more ? `<div class="scrim" data-more></div><div class="more" id="moreSheet">${MORE.map(m =>
      `<button data-tab="${m[0]}" ${S.tab===m[0] ? 'aria-current="page"' : ""}><b>${m[1]}</b><span>${m[2]}</span></button>`).join("")}</div>` : "")
    + `<nav class="bar" aria-label="Sections">${BAR.map(b =>
      `<button data-tab="${b[0]}" ${S.tab===b[0] && !S.more ? 'aria-current="page"' : ""}>${b[2]}<span>${b[1]}</span></button>`).join("")}
      <button data-more aria-expanded="${S.more}" aria-controls="moreSheet" class="${inMore ? "cur" : ""}">${MORE_ICON}<span>More</span></button></nav>`;
}
function draw(){
  syncSlots();
  document.body.dataset.view = S.tab;
  $("tabs").innerHTML = TABS.map(t => `<button class="tab" role="tab" aria-selected="${S.tab===t[0]}" data-tab="${t[0]}">${t[0]==="home" && me() ? me().name+"'s trip" : t[1]}</button>`).join("");
  $("nav").innerHTML = nav();
  TABS.forEach(t => { const p = $("p-"+t[0]); p.classList.toggle("on", S.tab === t[0]); p.innerHTML = S.tab === t[0] ? RENDER[t[0]]() : ""; });
  $("whoBtn").textContent = me() ? "Not "+me().name+"?" : "";
  const sel = document.querySelector(".tab[aria-selected=true]"); if(sel && sel.offsetParent && sel.scrollIntoView) sel.scrollIntoView({block:"nearest", inline:"center"});
}
function remember(){ try{ localStorage.setItem("scot28who", S.who || ""); }catch(e){} }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"), w = e.target.closest("[data-who]"), o = e.target.closest("[data-slot]"), vt = e.target.closest("[data-vote]"), act = e.target.closest("[data-act]");
  if(t){ S.tab = t.dataset.tab; S.more = false; S.x.msg = ""; V.msg = ""; history.replaceState(null, "", "#"+S.tab); window.scrollTo(0,0); }
  else if(e.target.closest("[data-more]")){ S.more = !S.more; }
  else if(w){ S.who = w.dataset.who; remember(); V.note = ""; V.msg = ""; S.touched = {}; loadDraft(); window.scrollTo(0,0); }
  else if(vt){ setVote(vt.dataset.vote, vt.dataset.val); }
  else if(o){ if(slotPick(o.dataset.slot)) return; S[o.dataset.slot] = o.dataset.id; S.touched[o.dataset.slot] = true; }
  else if(act){ const a = act.dataset.act;
    if(a === "splitAll" || a === "splitNone"){ document.querySelectorAll("#expForm [name=split]").forEach(c => c.checked = a === "splitAll"); return; }
    if(a === "refreshVotes"){ S.tab = "decisions"; S.more = false; V.msg = ""; history.replaceState(null, "", "#decisions"); loadBallots(); window.scrollTo(0,0); return; }
    if(a === "toLock"){ const el = $("lock"); if(el && el.scrollIntoView) el.scrollIntoView({block:"start", behavior:"smooth"}); return; }
    if(a === "revertVotes"){ V.draft = Object.assign({}, submitted()); V.msg = ""; S.touched = {}; saveDraft(); draw(); return; }
    const id = act.dataset.id; S.x.msg = "";
    if(a === "delExp"){ delExpense(id); return; }
    if(a === "signOut") signOut();
    else if(a === "editExp"){ S.x.edit = id; S.x.form = true; draw(); const el = $("entry"); if(el && el.scrollIntoView) el.scrollIntoView({block:"start"}); return; }
    else { S.x.form = a === "openForm"; S.x.edit = null; } }
  else if(e.target.id === "whoBtn"){ S.who = null; S.tab = "home"; remember(); S.touched = {}; loadDraft(); }
  else return;
  draw();
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && S.more){ S.more = false; draw(); } });
document.addEventListener("visibilitychange", () => { if(!document.hidden) checkFresh(); });
window.addEventListener("focus", checkFresh);
window.addEventListener("online", checkFresh);
setInterval(checkFresh, 60000);

(function init(){
  $("favIcon").href = $("touchIcon").href;
  const q = new URLSearchParams(location.search).get("g");
  let saved = ""; try{ saved = localStorage.getItem("scot28who") || ""; }catch(e){}
  const id = (q || saved).toLowerCase();
  if(GOLFERS.some(g => g.id === id)){ S.who = id; if(q) remember(); }
  const h = location.hash.slice(1); if(RENDER[h]) S.tab = h;
  $("updated").textContent = TRIP.updated;
  try{ S.x.code = sessionStorage.getItem("scot28code") || localStorage.getItem("scot28code") || ""; S.x.role = sessionStorage.getItem("scot28role") || localStorage.getItem("scot28role") || ""; }catch(e){}
  draw();
  loadExpenses();
  loadBallots();
})();
</script>
</body>
